[project]
name = "oscar"
version = "0.1.0"
description = "Multi-omics classification with PyTorch Lightning (OSCAR)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pytorch-lightning==2.6.4",
    "torchmetrics==1.9.0",
    "lightning-utilities==0.15.3",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "pyyaml==6.0.3",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "torchaudio==2.5.1+cu121",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

data:
  x_rna_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\BRCA\BRCA_mRNA.csv
  x_cnv_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\BRCA\BRCA_CNV_1_channel.csv
  x_proteomics_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\BRCA\BRCA_proteomics.csv
  y_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\BRCA\BRCA_label_num.csv
  # Run once from repo root: python prepare_kfold_splits.py --input-dir csv/processed/BRCA
  # Paths above stay the same (stems for fold filenames; pretrain still uses full CSVs).
  pre_split_base: csv/processed/BRCA/5-fold
  val_split: 0.2
  use_stratified_kfold: true
  n_folds: 5
  # For visualize_attention.py when using pre_split_base
  current_fold: 0

model:
  name: self_attn_fusion
  input_dims:
    Proteomics: 223
    CNV: 19273
    mRNA: 19580
  num_classes: 4
  latent_dim: 128
  hidden_dim: 512        # encoder_hidden_dim in the model
  fusion_hidden: 256
  dropout: 0.3
  n_heads: 4
  n_layers: 2
  fusion_type: attention  # "attention" or "concat"
  use_cross_attention: true
  use_gated_fusion: false
  cross_attn_hidden: 128
  use_original_for_proteomics: true
  gated_fusion_hidden: 256

train:
  epochs: 100
  lr: 2e-4
  weight_decay: 1e-5
  batch_size: 32
  num_workers: 4
  seed: 42
  normalize: false
  pretrain_all:
    enable: false
    epochs: 0
    val_split: 0.0
  early_stopping:
    enable: true
    patience: 15
    min_delta: 0.0

logging:
  log_dir: lightning_logs
  log_name: brca_self_attn_cross_attn_fusion_mogcn_data
  logger_type: tensorboard




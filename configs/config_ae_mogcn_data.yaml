data:
  x_rna_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_mRNA.csv
  x_cnv_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_CNV_1_channel.csv
  x_proteomics_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_proteomics.csv
  y_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_label_num.csv
  val_split: 0.2
  use_stratified_kfold: true
  n_folds: 5

model:
  name: concat
  input_dims:
    Proteomics: 223
    CNV: 19273
    mRNA: 19580
  num_classes: 4
  latent_dim: 64
  hidden_dim: 512
  fusion_hidden: 256
  dropout: 0.3
  lambda_rec: 1.0
  pretrain_epochs: 20
  denoise_std: 0.01
  use_focal_loss: false
  use_cross_attention: true
  use_original_for_proteomics: true
  cross_attn_hidden: 128
  fusion_type: concat
train:
  epochs: 100
  lr: 2e-4
  weight_decay: 1e-5
  batch_size: 32
  num_workers: 4
  seed: 42
  normalize: false
  pretrain_all:
    enable: true
    epochs: 50
    val_split: 0.0
  early_stopping:
    enable: true
    patience: 15
    min_delta: 0.0

logging:
  log_dir: lightning_logs
  log_name: brca_ae_fusion_mogcn_data_new_cross_attention_concat
  logger_type: tensorboard

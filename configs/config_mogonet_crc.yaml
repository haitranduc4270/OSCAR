data:
  x_rna_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\COADREAD\COADREAD_mRNA.csv
  x_cnv_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\COADREAD\COADREAD_CNV_1_channel.csv
  x_proteomics_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\COADREAD\COADREAD_proteomics.csv
  y_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\COADREAD\COADREAD_label_num.csv
  pre_split_base: csv/processed/COADREAD/5-fold
  val_split: 0.2
  use_stratified_kfold: true
  n_folds: 5

model:
  name: mogonet
  input_dims: null
  num_classes: 4
  hidden_dims: [400, 400, 200]
  dropout: 0.5
  adj_parameter: 10
  pretrain_epochs: 500
  lr_c: 0.001
  lr_e_pretrain: 0.001

train:
  epochs: 200
  lr: 5e-4
  weight_decay: 0.0
  batch_size: 512
  num_workers: 0
  seed: 42
  normalize: true
  deterministic: false
  loss: ce
  optimizer: adam
  save_last_checkpoint: false
  save_weights_only: true
  early_stopping:
    enable: true
    patience: 50
    min_delta: 0.001
  save_checkpoints: false

logging:
  enabled: false
  log_dir: lightning_logs
  log_name: crc_mogonet
  logger_type: tensorboard
  report_dir: lightning_logs

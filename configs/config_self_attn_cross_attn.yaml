data:
  x_rna_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_mRNA.csv
  x_cnv_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_CNV_1_channel.csv
  x_proteomics_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_proteomics.csv
  y_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_label_num.csv
  # Run once from repo root: python prepare_kfold_splits.py --input-dir csv/processed/LUNG
  # Paths above stay the same (stems for fold filenames; pretrain still uses full CSVs).
  pre_split_base: csv/processed/LUNG/5-fold
  val_split: 0.2
  use_stratified_kfold: true
  n_folds: 5
  # For visualize_attention.py when using pre_split_base
  current_fold: 0

model:
  name: self_attn_fusion
  # Must match row counts in processed CSVs: mRNA 19580, CNV 19273, Proteomics 223
  # Or use input_dims: null to take sizes from the datamodule after setup.
  input_dims:
    # for BRCA
    # Proteomics: 223
    # CNV: 19273
    # mRNA: 19580

    # for COADREAD
    # Proteomics: 153
    # CNV: 24776
    # mRNA: 20530

    # for LUNG
    Proteomics: 180
    CNV: 24776
    mRNA: 20530
  num_classes: 4
  latent_dim: 128
  hidden_dim: 512
  fusion_hidden: 128
  dropout: 0.4
  n_heads: 8
  n_layers: 2
  fusion_type: attention
  use_cross_attention: true
  use_gated_fusion: true
  cross_attn_hidden: 128
  use_original_for_proteomics: true
  gated_fusion_hidden: 256
train:
  epochs: 200
  lr: 2e-4
  weight_decay: 1e-5
  batch_size: 32
  num_workers: 4
  seed: 42
  normalize: true
  deterministic: false
  precision: 16-mixed
  pretrain_all:
    enable: false
    epochs: 0
    val_split: 0.0
  save_last_checkpoint: false
  save_weights_only: true  # ~85 MB vs ~242 MB; avoids MemoryError during checkpoint save
  early_stopping:
    enable: true
    patience: 15
    min_delta: 0.001

logging:
  log_dir: lightning_logs
  log_name: lung_self_attn_cross_attn_mrna_cnv_prot_mogcn_data
  logger_type: tensorboard




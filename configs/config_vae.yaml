data:
  x_rna_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/Main_Dataset/Classification_datasets/GS-BRCA/Top/BRCA_mRNA_top.csv
  x_cnv_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/Main_Dataset/Classification_datasets/GS-BRCA/Top/BRCA_CNV_top.csv
  x_meth_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/Main_Dataset/Classification_datasets/GS-BRCA/Top/BRCA_Methy_top.csv
  y_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/Main_Dataset/Classification_datasets/GS-BRCA/Top/BRCA_label_num.csv
  val_split: 0.2
  use_stratified_kfold: true
  n_folds: 5

model:
  name: vae_fusion
  input_dims:
    Methylation: 5000
    CNV: 5000
    mRNA: 5000
  num_classes: 5
  latent_dim: 128
  hidden_dim: 512
  fusion_hidden: 256
  dropout: 0.3
  lambda_recon: 1.0
  lambda_kl: 0.001
  pretrain_epochs: 20

train:
  epochs: 100
  lr: 2e-4
  weight_decay: 1e-5
  batch_size: 32
  num_workers: 4
  seed: 42
  normalize: false
  pretrain_all:
    enable: true
    epochs: 50
    val_split: 0.0
  early_stopping:
    enable: true
    patience: 10
    min_delta: 0.0

logging:
  log_dir: lightning_logs
  log_name: brca_vae_fusion
  logger_type: tensorboard
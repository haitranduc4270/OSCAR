data:
  x_rna_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_mRNA.csv
  x_cnv_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_CNV_1_channel.csv
  x_proteomics_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_proteomics.csv
  y_path: C:\Users\haitr\Documents\DL\cancer-multi-omics-experiment\csv\processed\LUNG\LUNG_label_num.csv
  pre_split_base: csv/processed/LUNG/5-fold
  val_split: 0.2
  use_stratified_kfold: true
  n_folds: 5

# Hyperparams from MoXGATE §2.1.6 (arXiv:2506.06980). Do not "upgrade" these
# to match OSCAR — this config is the paper baseline for fair comparison.
model:
  name: moxgate
  input_dims: null
  num_classes: 2
  latent_dim: 256          # combined embedding dim
  classifier_dim: 128      # final embedding before class FC
  attn_dropout: 0.1
  classifier_dropout: 0.3
  n_heads: 8               # modality SA
  joint_n_heads: 32        # cross-/joint attention
  use_focal_loss: true
  focal_gamma: 2.0
  # λ1, λ2 in eq. (14); magnitudes not stated in paper
  lambda_modality: 0.01
  lambda_cross_frobenius: 0.01
  # legacy aliases (mapped inside MoXGATEModel; prefer keys above)
  hidden_dim: 0
  fusion_hidden: 128
  dropout: 0.1
  modality_balance_weight: 0.01

train:
  epochs: 200
  lr: 1.0e-4
  weight_decay: 1.0e-2
  batch_size: 32
  num_workers: 0
  seed: 42
  normalize: true
  deterministic: false
  precision: 16-mixed
  save_last_checkpoint: false
  save_weights_only: true
  early_stopping:
    enable: true
    patience: 15
    min_delta: 0.001
  save_checkpoints: true

logging:
  enabled: false
  log_dir: lightning_logs
  log_name: lung_moxgate
  logger_type: tensorboard

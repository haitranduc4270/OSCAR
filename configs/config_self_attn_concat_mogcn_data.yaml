data:
  # x_rna_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_mRNA.csv
  # x_cnv_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_CNV_1_channel.csv
  # x_proteomics_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_proteomics.csv
  # y_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/BRCA_label_num.csv
  # x_rna_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/COADREAD/COADREAD_mRNA.csv
  # x_cnv_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/COADREAD/COADREAD_CNV_1_channel.csv
  # x_proteomics_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/COADREAD/COADREAD_proteomics.csv
  # y_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/COADREAD/COADREAD_label_num.csv
  x_rna_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/LUNG/LUNG_mRNA.csv
  x_cnv_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/LUNG/LUNG_CNV_1_channel.csv
  x_proteomics_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/LUNG/LUNG_proteomics.csv
  y_path: /home3/tuannd/Cancer-Multi-Omics-Benchmark/csv/processed/LUNG/LUNG_label_num.csv
  val_split: 0.2
  use_stratified_kfold: true
  n_folds: 5

model:
  name: self_attn_fusion
  input_dims:
    # Proteomics: 223
    # CNV: 19273
    # mRNA: 19580
    # Proteomics: 153 # for COADREAD
    # CNV: 24776
    # mRNA: 20530
    Proteomics: 180  # for LUNG
    CNV: 24776
    mRNA: 20530
  num_classes: 4
  latent_dim: 128
  hidden_dim: 512        # encoder_hidden_dim in the model
  fusion_hidden: 256
  dropout: 0.3
  n_heads: 4
  n_layers: 2
  fusion_type: concat  # "attention" or "concat"
  use_cross_attention: false
  cross_attn_hidden: 128
  use_gated_fusion: true
  use_original_for_proteomics: true

train:
  epochs: 100
  lr: 2e-4
  weight_decay: 1e-5
  batch_size: 32
  num_workers: 4
  seed: 42
  normalize: false
  pretrain_all:
    enable: false
    epochs: 0
    val_split: 0.0
  early_stopping:
    enable: true
    patience: 15
    min_delta: 0.0

logging:
  log_dir: lightning_logs
  log_name: lung_self_attn_concat_fusion
  logger_type: tensorboard

